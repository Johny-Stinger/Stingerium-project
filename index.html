<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stingerium Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background-color: #030307;
            overflow-x: hidden;
        }

        /* Kontejner pro živé video na pozadí */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* Hlavní obrazovka s flexboxem, aby se obsah držel dole nad rukama */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding: 2rem 1rem 2rem 1rem;
            /* Tmavý závoj přes video, aby text a ikony perfektně vynikly */
            background: linear-gradient(rgba(3, 3, 7, 0.2), rgba(3, 3, 7, 0.6));
        }

        .container {
            max-width: 600px;
            width: 100%;
            z-index: 2;
            margin-bottom: 1rem;
        }

        /* Styl mobilních aplikací - Mřížka pro ikonki */
        .app-grid {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        /* Vzhled jedné "mobilní aplikace" */
        .app-icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 95px;
            height: 95px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(15, 15, 30, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 22px; /* iOS / Android app style zaoblení */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: appFloat 4s ease-in-out infinite;
        }

        /* Odlišené barvy a časy vznášení pro každou appku */
        .app-tv {
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            animation-delay: 0s;
        }
        .app-music {
            border: 2px solid #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            animation-delay: 1.3s;
        }
        .app-art {
            border: 2px solid #ffb700;
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.3);
            animation-delay: 2.6s;
        }

        @keyframes appFloat {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.03); }
            100% { transform: translateY(0px) scale(1); }
        }

        .app-icon-card:hover {
            transform: translateY(-10px) scale(1.08);
            background: rgba(30, 30, 50, 0.9);
        }

        .app-icon-card .emoji {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .app-icon-card span {
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
            text-align: center;
            padding: 0 4px;
        }

        .app-tv span { color: #00ffff; }
        .app-music span { color: #ff00ff; }
        .app-art span { color: #ffb700; }

        /* Patka */
        footer {
            font-size: 0.75rem;
            color: #aaa;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            z-index: 2;
        }

        footer a {
            color: #00ffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Živé video na pozadí -->
    <video autoplay loop muted playsinline class="video-background">
        <source src="pozadi.mp4" type="video/mp4">
        Tvůj prohlížeč nepodporuje video pozadí.
    </video>

    <section class="hero">
        <div class="container">
            <!-- Živé ikonky jako aplikace v telefonu -->
            <div class="app-grid">
                <a href="tv.html" class="app-icon-card app-tv">
                    <div class="emoji">📺</div>
                    <span>AI TV</span>
                </a>

                <a href="music.html" class="app-icon-card app-music">
                    <div class="emoji">🎵</div>
                    <span>Studio</span>
                </a>

                <a href="art.html" class="app-icon-card app-art">
                    <div class="emoji">🌌</div>
                    <span>N.O.V.E.</span>
                </a>
            </div>
        </div>

        <footer>
            <p>Powered by <strong>N.O.V.E. Philosophy</strong> &bull; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a></p>
        </footer>
    </section>

</body>
</html>
