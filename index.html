<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stingerium Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background-color: #030307;
            overflow-x: hidden;
        }

        /* Hlavní obrazovka s tvým hotovým obrázkem (včetně nápisu v grafice) */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding: 2rem 1rem 1.5rem 1rem;
            background-image: linear-gradient(rgba(3, 3, 7, 0.1), rgba(3, 3, 7, 0.7)), url('pozadi.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            max-width: 800px;
            width: 100%;
            z-index: 2;
            margin-bottom: 1rem;
        }

        /* Kompaktní mřížka pro tlačítka, aby hezky seděla na mobilu */
        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .nav-card {
            display: flex;
            align-items: center;
            padding: 0.9rem 1.2rem;
            text-decoration: none;
            color: #ffffff;
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-card .icon {
            font-size: 1.6rem;
            margin-right: 1rem;
        }

        .nav-card h2 {
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            text-align: left;
        }

        /* 1. TV - Kyanová */
        .card-tv {
            border: 2px solid #00ffff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
        }
        .card-tv h2 { color: #00ffff; }
        .card-tv:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
        }

        /* 2. Music & Studio - Magenta */
        .card-music {
            border: 2px solid #ff00ff;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.25);
        }
        .card-music h2 { color: #ff00ff; }
        .card-music:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);
        }

        /* 3. Alt. Umění - Jantarová */
        .card-art {
            border: 2px solid #ffb700;
            box-shadow: 0 0 12px rgba(255, 183, 0, 0.25);
        }
        .card-art h2 { color: #ffb700; }
        .card-art:hover {
            background: rgba(255, 183, 0, 0.2);
            box-shadow: 0 0 25px rgba(255, 183, 0, 0.6);
        }

        /* Patka */
        footer {
            font-size: 0.75rem;
            color: #aaa;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            z-index: 2;
            margin-top: 0.5rem;
        }

        footer a {
            color: #00ffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container">
            <div class="nav-grid">
                <a href="tv.html" class="nav-card card-tv">
                    <div class="icon">📺</div>
                    <h2>Stingerium AI TV</h2>
                </a>

                <a href="music.html" class="nav-card card-music">
                    <div class="icon">🎵</div>
                    <h2>Music & Studio</h2>
                </a>

                <a href="art.html" class="nav-card card-art">
                    <div class="icon">🌌</div>
                    <h2>Alt. Umění & N.O.V.E.</h2>
                </a>
            </div>
        </div>

        <footer>
            <p>Powered by <strong>N.O.V.E. Philosophy</strong> &bull; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a></p>
        </footer>
    </section>

</body>
</html>
